spring:
  application:
    name: blog
  # Local secrets (SMTP credentials) live in a git-ignored file; environment variables also work.
  config:
    import: optional:file:./config/secrets.yaml

  # ===== Mail (Gmail SMTP by default) =====
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  datasource:
    url: jdbc:mysql://localhost:3306/blog?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password:

  # ===== Flyway =====
  flyway:
    enabled: true
    baseline-on-migrate: true
    # db/demo = fake demo content + the demo admin account (dev only). The prod profile leaves it out.
    locations: classpath:db/migration,classpath:db/demo

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  # ===== i18n =====
  # messages.properties = Vietnamese (the default, and the fallback for a key missing from _en).
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    # A missing key must fail loudly in dev instead of rendering its own name.
    use-code-as-default-message: false

  # ===== Thymeleaf =====
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false   # false khi dev, true khi prod

  # ===== DevTools =====
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  # ===== File upload =====
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 40MB

# ===== Media library =====
app:
  trash:
    # Shared Trash (posts, categories, hashtags, comments). Off in dev; application-prod.yaml turns it on.
    retention-days: 30
    auto-purge-enabled: false
    purge-cron: "0 45 3 * * *"
  mail:
    # Off unless config/secrets.yaml (or MAIL_ENABLED) turns it on: when off, emails are only logged.
    # Test runs force it off (maven-surefire systemPropertyVariables).
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@kienhee.com}
    from-name: Kienhee
    # Absolute links in emails (password reset) are built from this.
    base-url: ${APP_BASE_URL:http://localhost:8080}
  upload:
    dir: ./uploads
  media:
    trash:
      # Files/folders are soft-deleted into a trash. They still occupy the owner's quota
      # until they are purged - only a purge frees disk and quota.
      retention-days: 30
      # Off by default on purpose: starting the app must never destroy trashed files by
      # itself. Turn on per environment.
      auto-purge-enabled: false
      purge-cron: "0 30 3 * * *"

tinify:
  api-key: ${TINIFY_API_KEY:}
