<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-master}">
<head>
    <title th:text="#{nav.admin.roles}">Roles</title>
</head>
<body>

<div layout:fragment="breadcrumb" class="crumb">
    <a th:href="@{/admin/dashboard}" class="dim" th:text="#{nav.admin.dashboard}">Dashboard</a><span style="color:var(--line)">/</span><strong th:text="#{nav.admin.roles}">Roles</strong>
</div>

<div layout:fragment="content">
      <h1 style="font-size:34px" th:text="#{admin.role.title}">Roles &amp; permissions</h1>
      <p class="dim" style="margin:6px 0 24px" th:text="#{admin.role.intro}">Pick a role on the left, set what it can do, then save.</p>

      <div th:if="${successMessage}" style="margin-bottom:18px;padding:12px 14px;background:rgba(46,213,115,0.12);border:1px solid #2ed573;color:#2ed573;border-radius:6px;font-size:13px;font-weight:600">
          <span th:text="${successMessage}">Success message</span>
      </div>
      <div th:if="${errorMessage}" style="margin-bottom:18px;padding:12px 14px;background:rgba(255,77,77,0.12);border:1px solid #ff4d4d;color:#ff6b6b;border-radius:6px;font-size:13px;font-weight:600">
          <span th:text="${errorMessage}">Error message</span>
      </div>

      <div class="roles-grid">
        <div class="roles-list" style="border-right:1px solid var(--line)">
          <a th:each="r : ${roles}"
             th:href="@{/admin/roles(roleId=${r.id})}"
             th:attr="aria-pressed=${selectedRole != null and selectedRole.id == r.id} ? 'true' : 'false'"
             style="position:relative;display:flex;flex-direction:column;gap:4px;align-items:flex-start;width:100%;padding:16px 20px;border-bottom:1px solid var(--line);text-align:left">
            <span style="font-size:16px;font-weight:700" th:text="${r.name}">Owner</span>
            <span class="dim" style="font-size:12px">
              <span th:text="${userCounts != null and userCounts.containsKey(r.id) ? userCounts.get(r.id) : 0}">0</span>
              <span th:text="#{admin.role.users_suffix}"> users</span>
              <span th:if="${r.systemRole}" th:text="#{admin.role.system_suffix}"> · system role</span>
              <span th:unless="${r.systemRole}" th:text="#{admin.role.permissions_suffix(${r.permissions.size()})}"></span>
            </span>
          </a>

          <form class="role-create" th:if="${perms.contains('roles:create')}" method="post" th:action="@{/admin/roles}">
            <input class="input" name="name" th:placeholder="#{admin.role.new_name}" required minlength="2">
            <input class="input" name="description" th:placeholder="#{admin.role.new_description}">
            <button class="btn btn-ghost btn-xs" type="submit" th:text="#{admin.role.add}">Add role</button>
          </form>
        </div>

        <div th:if="${selectedRole == null}" style="padding:40px 20px" class="dim" th:text="#{admin.role.empty}">No roles yet.</div>

        <div th:if="${selectedRole != null}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:2px solid var(--rule)">
            <span style="font-size:18px;font-weight:700" data-role-title
                  th:text="#{admin.role.of(${selectedRole.name})}">Editor permissions</span>
            <span style="display:flex;gap:8px">
              <button th:if="${perms.contains('roles:edit') and !selectedRole.systemRole}"
                      class="btn btn-sm" type="submit" form="permissions-form" th:text="#{admin.role.save}">Save changes</button>
              <button th:if="${perms.contains('roles:delete') and !selectedRole.systemRole}"
                      type="button" class="btn btn-ghost btn-sm btn-danger" id="btn-delete-role"
                      th:data-id="${selectedRole.id}" th:data-name="${selectedRole.name}" th:text="#{admin.role.delete}">Delete role</button>
            </span>
          </div>

          <p th:if="${selectedRole.systemRole}" class="dim" style="padding:14px 20px;font-size:13px;border-bottom:1px solid var(--line)"
             th:text="#{admin.role.system_note}">This is a system role with full access.</p>
          <p th:if="${selectedRoleDescription != null}" class="dim" style="padding:14px 20px;font-size:13px;border-bottom:1px solid var(--line)"
             th:text="${selectedRoleDescription}">Description</p>

          <form id="permissions-form" method="post" th:action="@{'/admin/roles/' + ${selectedRole.id} + '/permissions'}">
            <div class="perm-matrix">
              <div class="perm-row" th:each="row : ${permissionMatrix}">
                <div class="perm-label" th:text="#{'perm.module.' + ${row.resource}}">Posts</div>
                <div class="perm-cells">
                  <label th:each="cell : ${row.cells}" th:title="${cell.code}">
                    <input class="checkbox" type="checkbox" name="permissionIds"
                           th:value="${cell.id}"
                           th:checked="${cell.granted}"
                           th:disabled="${selectedRole.systemRole or !perms.contains('roles:edit')}">
                    <span class="perm-text">
                      <span class="kicker" th:text="#{'perm.action.' + ${cell.action}}">view</span>
                      <span class="dim perm-desc" th:text="#{'perm.' + ${row.resource} + '.' + ${cell.action}}">View posts</span>
                    </span>
                  </label>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Hidden form for deleting a role -->
      <form id="delete-role-form" method="post" th:action="@{/admin/roles/0/delete}" style="display:none"></form>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/scripts/role/role.js}"></script>
</th:block>

</body>
</html>
