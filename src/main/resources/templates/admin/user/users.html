<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-master}">
<head>
    <title th:text="#{nav.admin.users}">Users</title>
</head>
<body>

<div layout:fragment="breadcrumb" class="crumb">
    <a th:href="@{/admin/dashboard}" class="dim" th:text="#{nav.admin.dashboard}">Dashboard</a><span style="color:var(--line)">/</span><strong th:text="#{nav.admin.users}">Users</strong>
</div>

<div layout:fragment="content">
      <div class="dt-root">
        <div class="page-head">
          <div>
            <h1 th:text="#{nav.admin.users}">Users</h1>
            <p class="dim" style="margin-top:6px" th:text="#{admin.user.count(${users != null ? users.size() : 0})}">0 accounts</p>
          </div>
          <button th:if="${perms.contains('users:create')}" type="button" class="btn" id="btn-create-user" data-oc-open th:text="#{admin.user.new}">New user</button>
        </div>

        <!-- Notification alerts -->
        <div th:if="${successMessage}" style="margin-bottom:18px;padding:12px 14px;background:rgba(46,213,115,0.12);border:1px solid #2ed573;color:#2ed573;border-radius:6px;font-size:13px;font-weight:600">
            <span th:text="${successMessage}">Success message</span>
        </div>
        <div th:if="${errorMessage}" style="margin-bottom:18px;padding:12px 14px;background:rgba(255,77,77,0.12);border:1px solid #ff4d4d;color:#ff6b6b;border-radius:6px;font-size:13px;font-weight:600">
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <div class="bulk">
          <span class="n" th:text="#{admin.common.selected(0)}">0 selected</span>
          <button th:if="${perms.contains('users:delete')}" class="btn btn-ghost btn-xs btn-danger" th:data-bulk="#{admin.dialog.delete}" th:text="#{admin.dialog.delete}">Delete</button>
                    <button data-bulk-clear style="margin-left:auto;background:transparent;border:none;color:var(--dim);font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer" th:text="#{admin.common.clear}">Clear</button>
        </div>

        <th:block th:with="waiting=${#lists.size(users.?[status.name() == 'PENDING'])}"><div th:if="${waiting > 0}"
             style="margin-bottom:18px;padding:12px 14px;background:rgba(255,201,77,0.12);border:1px solid #ffc94d;color:#ffc94d;border-radius:6px;font-size:13px;font-weight:600">
          <span th:text="#{admin.user.waiting(${waiting})}">1 account waiting for approval.</span>
        </div></th:block>

        <div class="table-wrap">
          <table class="dt" th:data-bulk-delete-url="@{/admin/users/bulk-delete}" th:data-bulk-noun="#{nav.admin.users}" th:data-bulk-delete-note="#{admin.user.bulk_note}">
            <thead>
              <tr>
                <th style="width:44px"><input class="checkbox allcheck" type="checkbox"></th>
                <th style="width:22%" th:text="#{admin.common.name}">Name</th>
                <th style="width:22%" th:text="#{admin.common.email}">Email</th>
                <th style="width:120px" th:text="#{admin.user.role}">Role</th>
                <th style="width:110px" th:text="#{admin.common.status}">Status</th>
                <th style="width:130px" th:text="#{admin.user.phone}">Phone</th>
                <th style="width:18%" th:text="#{admin.user.address}">Address</th>
                <th style="width:140px" th:text="#{admin.common.created}">Created</th>
                <th style="width:110px;text-align:right"><span class="kicker" th:text="#{admin.common.actions}">Actions</span></th>
              </tr>
              <tr class="filters">
                <th></th>
                <th><input class="input" data-col="1" th:placeholder="#{admin.common.filter}"></th>
                <th><input class="input" data-col="2" th:placeholder="#{admin.common.filter}"></th>
                <th>
                  <select class="select" data-col="3">
                    <option value="" th:text="#{common.all}">All</option>
                    <option th:each="r : ${roles}" th:value="${r.name}" th:text="${r.name}"></option>
                  </select>
                </th>
                <th>
                  <select class="select" data-col="4">
                    <option value="" th:text="#{common.all}">All</option>
                    <option value="Pending" th:value="#{enum.user.status.PENDING}" th:text="#{enum.user.status.PENDING}">Pending</option>
                    <option value="Active" th:value="#{enum.user.status.ACTIVE}" th:text="#{enum.user.status.ACTIVE}">Active</option>
                    <option value="Disabled" th:value="#{enum.user.status.DISABLED}" th:text="#{enum.user.status.DISABLED}">Disabled</option>
                  </select>
                </th>
                <th><input class="input" data-col="5" th:placeholder="#{admin.common.filter}"></th>
                <th><input class="input" data-col="6" th:placeholder="#{admin.common.filter}"></th>
                <th><input class="input" data-col="7" th:placeholder="#{admin.common.filter}"></th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr class="row" th:each="u : ${users}">
                <td><input class="checkbox rowcheck" type="checkbox" th:value="${u.id}"></td>
                <td class="strong" th:text="${u.fullName}">User Name</td>
                <td class="dim" th:text="${u.email}">user@email.com</td>
                <td>
                  <span class="badge" th:if="${u.role != null}" th:text="${u.role.name}"
                        th:style="${u.role.systemRole} ? 'color:#5ee38a' : 'color:#a0a0a0'">Owner</span>
                  <span class="dim" th:if="${u.role == null}" th:text="#{admin.user.no_role_short}">— none —</span>
                </td>
                <td>
                  <span class="badge"
                        th:style="${u.status.name() == 'ACTIVE'} ? 'color:#5ee38a' : (${u.status.name() == 'PENDING'} ? 'color:#ffc94d' : 'color:#a0a0a0')"
                        th:text="#{'enum.user.status.' + ${u.status.name()}}">Active</span>
                </td>
                <td th:text="${u.phone != null and !u.phone.isEmpty() ? u.phone : '—'}">—</td>
                <td class="dim" th:text="${u.address != null and !u.address.isEmpty() ? u.address : '—'}">—</td>
                <td class="dim" th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm') : '—'}">—</td>
                <td class="right">
                  <span style="display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
                    <th:block th:if="${perms.contains('users:edit') and (currentUser == null or currentUser.id != u.id)}">
                      <button th:if="${u.status.name() == 'PENDING'}" type="button" class="btn btn-xs btn-user-status"
                              th:data-id="${u.id}" th:data-name="${u.fullName}" data-status="ACTIVE" th:text="#{admin.user.approve}">Approve</button>
                      <button th:if="${u.status.name() == 'ACTIVE'}" type="button" class="btn btn-ghost btn-xs btn-user-status"
                              th:data-id="${u.id}" th:data-name="${u.fullName}" data-status="DISABLED" th:text="#{admin.user.disable}">Disable</button>
                      <button th:if="${u.status.name() == 'DISABLED'}" type="button" class="btn btn-ghost btn-xs btn-user-status"
                              th:data-id="${u.id}" th:data-name="${u.fullName}" data-status="ACTIVE" th:text="#{admin.user.enable}">Enable</button>
                    </th:block>
                    <button th:if="${perms.contains('users:edit')}" type="button" class="btn btn-ghost btn-xs btn-edit-user"
                            th:data-id="${u.id}"
                            th:data-name="${u.fullName}"
                            th:data-email="${u.email}"
                            th:data-phone="${u.phone}"
                            th:data-address="${u.address}"
                            th:data-role="${u.role != null ? u.role.id : ''}"
                            th:data-bio="${u.bio}" th:text="#{admin.common.edit}">Edit</button>
                    <button th:if="${perms.contains('users:delete')}" type="button" class="btn btn-ghost btn-xs btn-danger btn-del-user"
                            th:data-id="${u.id}"
                            th:data-name="${u.fullName}" th:text="#{admin.common.del}">Del</button>
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Offcanvas Drawer for Create / Edit User -->
      <div class="offcanvas" th:classappend="${openOffcanvas != null ? 'open' : ''}">
        <div class="panel" id="oc-user-panel">
          <div class="oc-head">
            <div>
              <div class="kicker" id="oc-kicker" th:text="${openOffcanvas == 'edit'} ? #{admin.common.update} : #{admin.common.create}">Create</div>
              <div class="t" id="oc-title" th:text="${openOffcanvas == 'edit'} ? #{admin.user.edit} : #{admin.user.new}">New User</div>
            </div>
            <button type="button" class="icon-btn" data-oc-close th:aria-label="#{admin.common.close}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>

          <form id="user-form" method="post" th:action="@{/admin/users}" th:object="${userCreateRequest}">
            <input type="hidden" id="user-form-mode" value="create">
            <input type="hidden" id="user-id" name="id">

            <div class="oc-body">
              <div th:if="${#fields.hasGlobalErrors()}" style="margin-bottom:14px;padding:10px 14px;background:rgba(255,77,77,0.12);border:1px solid #ff4d4d;color:#ff6b6b;border-radius:6px;font-size:13px;font-weight:600">
                <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
              </div>

              <label class="field" id="field-fullName" th:classappend="${#fields.hasErrors('fullName')} ? 'has-error' : ''">
                <span><span th:text="#{auth.field.full_name}">Full name</span><span class="req"> *</span></span>
                <input class="input" id="user-fullName" name="fullName" th:value="*{fullName}" th:placeholder="#{admin.user.full_name_placeholder}">
                <span class="err show" id="err-fullName" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Full name is required.</span>
                <span class="err" id="err-fullName" th:unless="${#fields.hasErrors('fullName')}" th:text="#{validation.full_name.required}">Full name is required.</span>
              </label>

              <label class="field" id="field-email" th:classappend="${#fields.hasErrors('email')} ? 'has-error' : ''">
                <span><span th:text="#{admin.common.email}">Email</span><span class="req"> *</span></span>
                <input class="input" type="email" id="user-email" name="email" th:value="*{email}" th:placeholder="#{admin.user.email_placeholder}">
                <span class="err show" id="err-email" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email is required.</span>
                <span class="err" id="err-email" th:unless="${#fields.hasErrors('email')}" th:text="#{validation.email.required}">Email is required.</span>
              </label>

              <label class="field" id="field-password" th:classappend="${#fields.hasErrors('password')} ? 'has-error' : ''">
                <span><span th:text="#{auth.field.password}">Password</span><span class="req" id="user-pw-req"> *</span></span>
                <input class="input" type="password" id="user-password" name="password" th:placeholder="#{admin.user.password_placeholder}">
                <span class="dim" style="font-size:12px" id="user-pw-hint" th:text="#{admin.user.password_hint}">At least 6 characters.</span>
                <span class="err show" id="err-password" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password is required.</span>
                <span class="err" id="err-password" th:unless="${#fields.hasErrors('password')}" th:text="#{validation.password.required}">Password is required.</span>
              </label>

              <label class="field" id="field-roleId" th:classappend="${#fields.hasErrors('roleId')} ? 'has-error' : ''">
                <span th:text="#{admin.user.role}">Role</span>
                <select class="select" id="user-roleId" name="roleId">
                  <option value="" th:text="#{admin.user.no_role}">— No role (no access) —</option>
                  <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}"
                          th:selected="${userCreateRequest.roleId != null and userCreateRequest.roleId == r.id}"></option>
                </select>
                <span class="dim" style="font-size:12px" th:text="#{admin.user.no_role_hint}">A user without a role can sign in but can't do anything.</span>
                <span class="err show" id="err-roleId" th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}"></span>
              </label>

              <label class="field" id="field-phone" th:classappend="${#fields.hasErrors('phone')} ? 'has-error' : ''">
                <span th:text="#{admin.user.phone_number}">Phone number</span>
                <input class="input" id="user-phone" name="phone" th:value="*{phone}" th:placeholder="#{admin.user.phone_placeholder}">
                <span class="err show" id="err-phone" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                <span class="err" id="err-phone" th:unless="${#fields.hasErrors('phone')}"></span>
              </label>

              <label class="field" id="field-address" th:classappend="${#fields.hasErrors('address')} ? 'has-error' : ''">
                <span th:text="#{admin.user.address}">Address</span>
                <input class="input" id="user-address" name="address" th:value="*{address}" th:placeholder="#{admin.user.address_placeholder}">
                <span class="err show" id="err-address" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                <span class="err" id="err-address" th:unless="${#fields.hasErrors('address')}"></span>
              </label>

              <label class="field" id="field-bio" th:classappend="${#fields.hasErrors('bio')} ? 'has-error' : ''">
                <span th:text="#{admin.user.bio}">Bio</span>
                <textarea class="textarea" id="user-bio" name="bio" style="min-height:90px" th:placeholder="#{admin.user.bio_placeholder}" th:text="*{bio}"></textarea>
                <span class="err show" id="err-bio" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}"></span>
                <span class="err" id="err-bio" th:unless="${#fields.hasErrors('bio')}"></span>
              </label>
            </div>

            <div class="oc-foot">
              <button class="btn" type="submit" id="user-submit-btn" th:text="#{admin.user.submit_create}">Create user</button>
              <button type="button" class="btn btn-ghost" data-oc-close th:text="#{admin.common.cancel}">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Hidden form for deleting user -->
      <form id="user-status-form" method="post" th:action="@{/admin/users/0/status}" style="display:none"><input type="hidden" name="status"></form>
      <form id="delete-user-form" method="post" th:action="@{/admin/users/0/delete}" style="display:none"></form>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/scripts/user/user.js}"></script>
    <script th:src="@{/scripts/user/user-status.js}"></script>
</th:block>

</body>
</html>
