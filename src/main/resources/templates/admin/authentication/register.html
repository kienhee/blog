<!DOCTYPE html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — Kienhee Admin</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" th:href="@{/styles/main.css}">
<link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>
<body>
<div class="auth-shell">
  <form class="auth-card" id="auth-form" method="post" th:action="@{/auth/register}" th:object="${registerRequest}">
    <div class="h"><span style="font-size:22px;font-weight:800;letter-spacing:-.02em">Kienhee</span> </div>
    <div class="b">
      <div>
        <h1 style="font-size:32px;line-height:1.05" th:text="${firstAccount} ? 'Create the owner account' : 'Create account'">Create account</h1>
        <p class="dim" style="margin-top:8px;font-size:14px;line-height:1.5"><th:block th:if="${firstAccount}">This is the first account on the site, so it gets full admin access.</th:block><th:block th:unless="${firstAccount}">An administrator reviews new accounts. You can sign in once yours is approved.</th:block></p>
      </div>

      <div th:if="${errorMessage}" style="padding:12px 14px;background:rgba(255,77,77,0.12);border:1px solid #ff4d4d;color:#ff6b6b;border-radius:6px;font-size:13px;font-weight:600">
        <span th:text="${errorMessage}">Error message</span>
      </div>

      <label class="field" th:classappend="${#fields.hasErrors('fullName')} ? 'has-error' : ''">
        <span>Full name<span class="req"> *</span></span>
        <input class="input" type="text" th:field="*{fullName}" data-required placeholder="Enter your name">
        <span class="err show" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Full name is required.</span>
      </label>
      <label class="field" th:classappend="${#fields.hasErrors('email')} ? 'has-error' : ''">
        <span>Email<span class="req"> *</span></span>
        <input class="input" type="text" th:field="*{email}" data-required placeholder="Enter your email">
        <span class="err show" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email is required.</span>
      </label>
      <label class="field" th:classappend="${#fields.hasErrors('password')} ? 'has-error' : ''">
        <span>Password<span class="req"> *</span></span>
        <input class="input" type="password" th:field="*{password}" data-required placeholder="Enter your password">
        <span class="err show" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password is required.</span>
      </label>
      <button class="btn" type="submit" style="height:50px">Create account</button>
      <div style="display:flex;justify-content:space-between;gap:16px;padding-top:18px;border-top:1px solid var(--line)">
        <a class="dim" style="font-size:13px" th:href="@{/auth/login}">I already have an account</a>
        <a class="dim" style="font-size:13px" th:href="@{/auth/forgot}">Forgot password?</a>
      </div>
    </div>
  </form>
</div>
<div class="toast"><span>✓</span><span class="msg"></span></div>
<script th:src="@{/scripts/lib/jquery.min.js}"></script>
<script th:src="@{/scripts/lib/jquery.validate.min.js}"></script>
<script th:src="@{/scripts/core/admin.js}"></script>
<script th:src="@{/scripts/auth/auth.js}"></script>
</body>
</html>
