<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar" class="side" th:with="uri=${currentUri}">
    <div class="top"><span class="b">Kienhee</span><span class="badge-accent">Admin</span></div>
    <nav>
        <a th:href="@{/admin/dashboard}"
           th:attr="aria-current=${uri == '/admin' or #strings.startsWith(uri, '/admin/dashboard') or #strings.contains(uri, 'dashboard')} ? 'page' : null">
            <span class="l"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h7V4H4zM13 20h7v-9h-7zM4 20h7v-4H4zM13 8h7V4h-7z"/></svg></span>Dashboard</span><span class="c"></span>
        </a>
        <a th:href="@{/admin/posts}"
           th:attr="aria-current=${#strings.startsWith(uri, '/admin/post') or #strings.contains(uri, 'post')} ? 'page' : null">
            <span class="l"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M8 9h8"/><path d="M8 13h8"/><path d="M8 17h5"/></svg></span>Posts</span><span class="c">128</span>
        </a>
        <a th:href="@{/admin/categories}"
           th:attr="aria-current=${#strings.startsWith(uri, '/admin/categor') or #strings.contains(uri, 'categor')} ? 'page' : null">
            <span class="l"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg></span>Categories</span><span class="c">6</span>
        </a>
        <a th:href="@{/admin/hashtags}"
           th:attr="aria-current=${#strings.startsWith(uri, '/admin/hashtag') or #strings.contains(uri, 'hashtag')} ? 'page' : null">
            <span class="l"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14"/><path d="M5 15h14"/><path d="M10 4 8 20"/><path d="M16 4l-2 16"/></svg></span>Hashtags</span><span class="c">24</span>
        </a>
        <a th:href="@{/admin/media}"
           th:attr="aria-current=${#strings.startsWith(uri, '/admin/media') or #strings.contains(uri, 'media')} ? 'page' : null">
            <span class="l"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="m4 16 5-5 4 4 3-3 4 4"/></svg></span>Media library</span><span class="c">312</span>
        </a>
        <a th:href="@{/admin/comments}"
           th:attr="aria-current=${#strings.startsWith(uri, '/admin/comment') or #strings.contains(uri, 'comment')} ? 'page' : null">
            <span class="l"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></span>Comments</span><span class="c">7</span>
        </a>
        <a th:href="@{/admin/users}"
           th:attr="aria-current=${(#strings.startsWith(uri, '/admin/user') or #strings.contains(uri, 'user')) and !#strings.contains(uri, 'profile')} ? 'page' : null">
            <span class="l"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>Users</span><span class="c">5</span>
        </a>
        <a th:href="@{/admin/roles}"
           th:attr="aria-current=${#strings.startsWith(uri, '/admin/role') or #strings.contains(uri, 'role')} ? 'page' : null">
            <span class="l"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v6c0 5 8 8 8 8s8-3 8-8V7z"/><path d="m9 12 2 2 4-4"/></svg></span>Roles</span><span class="c">4</span>
        </a>
        <a th:href="@{/admin/settings}"
           th:attr="aria-current=${#strings.startsWith(uri, '/admin/setting') or #strings.contains(uri, 'setting')} ? 'page' : null">
            <span class="l"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1V3.5h-4v2.6a7 7 0 0 0-1.7 1l-2.3-1-2 3.4L5 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1v2.6h4v-2.6a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5c.1-.3.1-.7.1-1"/></svg></span>Settings</span><span class="c"></span>
        </a>
    </nav>
    <div class="foot">
        <a th:href="@{/admin/profile}" style="display:flex;align-items:center;gap:12px">
            <img th:if="${currentUser != null and currentUser.avatarUrl != null and !currentUser.avatarUrl.isEmpty()}" th:src="@{${currentUser.avatarUrl}}" alt="" class="av" style="object-fit:cover">
            <span th:unless="${currentUser != null and currentUser.avatarUrl != null and !currentUser.avatarUrl.isEmpty()}" class="av"></span>
            <span><span style="display:block;font-size:13px;font-weight:700" th:text="${currentUser != null ? currentUser.fullName : 'Admin'}">Kienhee</span><span class="dim" style="font-size:11px" th:text="${currentUser != null ? currentUser.email : 'Owner'}">Owner</span></span>
        </a>
        <a class="kicker" th:href="@{/auth/logout}">Sign out</a>
    </div>
</aside>

</body>
</html>
