<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>

<div th:fragment="topbar" class="topbar">
    <button class="side-toggle" data-side-toggle th:aria-label="#{common.menu}" aria-expanded="false">☰</button>
    <div class="crumb" layout:fragment="breadcrumb">
        <span class="dim" th:text="#{nav.admin.dashboard}">Dashboard</span><span style="color:var(--line)">/</span><strong th:text="${pageTitle} ?: #{nav.admin.dashboard}">Dashboard</strong>
    </div>
    <div class="head-actions">
        <input class="input" style="width:260px;height:36px;font-size:13px" th:placeholder="#{admin.topbar.search}">
        <div th:replace="~{fragments/lang-switch :: langSwitch}"></div>
        <button class="icon-btn" data-theme-toggle th:aria-label="#{common.toggle_theme}">☀</button>
        <a class="btn btn-sm" th:href="@{/}" target="_blank" th:text="#{nav.home}">Home</a>
    </div>
</div>

</body>
</html>
