<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/public-master}">
<head>
    <title th:text="#{public.news.title}">News &amp; Guides</title>
</head>
<body>
<main layout:fragment="content">
  <section class="wrap" style="padding-top:56px">
    <h1 class="page-title" th:text="#{public.news.title}">News &amp; Guides</h1>
    <p class="dim" style="margin-top:16px;font-size:17px;max-width:60ch" th:text="#{public.news.intro(${site['site.domain'] ?: '—'})}">Everything published, newest first.</p>
    <div class="chips" th:if="${!categories.isEmpty()}">
      <a class="chip" th:href="@{/news}" aria-pressed="true"><span th:text="#{common.all}">All</span><span class="bar"></span></a>
      <a class="chip" th:each="c : ${categories}" th:href="@{/category/{slug}(slug=${c.category.slug})}" aria-pressed="false"><span th:text="${c.category.name}">Category</span><span class="bar"></span></a>
    </div>
    <div th:if="${posts.isEmpty()}" th:replace="~{fragments/public/pagination :: empty(#{public.news.empty})}"></div>
    <th:block th:each="p : ${posts}"><a th:replace="~{fragments/public/pagination :: thumbRow(${p})}"></a></th:block>
    <nav th:replace="~{fragments/public/pagination :: pager(${posts}, '/news', null)}"></nav>
  </section>
</main>
</body>
</html>
