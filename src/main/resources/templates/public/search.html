<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/public-master}">
<head>
    <title th:text="#{public.search.title}">Search</title>
</head>
<body>
<main layout:fragment="content">
  <section class="wrap" style="padding-top:56px">
    <h1 class="page-title" th:text="#{public.search.title}">Search</h1>
    <form method="get" th:action="@{/search}" role="search" class="search-form">
      <input class="input" type="text" name="q" autocomplete="off" th:value="${q}" th:placeholder="#{public.search.placeholder}" maxlength="100" autofocus>
      <button class="btn" type="submit" th:text="#{public.search.title}">Search</button>
    </form>
    <!-- Hashtag mode: /search?tag=<slug>, reached from the #tag links on an article. -->
    <th:block th:if="${!tag.isEmpty()}">
      <p class="kicker" style="padding:28px 0 12px"
         th:with="tagName=${hashtag != null ? hashtag.name : tag}"
         th:text="${posts.totalElements == 1} ? #{public.search.tagged.one(${posts.totalElements},${tagName})} : #{public.search.tagged.other(${posts.totalElements},${tagName})}">4 articles tagged #ai</p>
      <p class="dim" th:if="${hashtag != null and !#strings.isEmpty(hashtag.description)}" style="padding-bottom:12px"
         th:text="${hashtag.description}">What this tag covers.</p>
      <th:block th:each="p : ${posts}"><a th:replace="~{fragments/public/pagination :: thumbRow(${p})}"></a></th:block>
      <!-- th:replace runs before th:if, so the condition lives on a wrapper block. -->
      <th:block th:if="${posts.totalElements == 0}">
        <p th:replace="~{fragments/public/pagination :: empty(#{public.search.tag_empty})}"></p>
      </th:block>
      <nav th:replace="~{fragments/public/pagination :: pagerTag(${posts}, '/search', ${tag})}"></nav>
    </th:block>

    <th:block th:if="${tag.isEmpty() and !q.isEmpty()}">
      <p class="kicker" style="padding:28px 0 12px"
         th:text="${posts.totalElements == 1} ? #{public.search.results.one(${posts.totalElements},${q})} : #{public.search.results.other(${posts.totalElements},${q})}">3 results for prompt</p>
      <th:block th:each="p : ${posts}"><a th:replace="~{fragments/public/pagination :: thumbRow(${p})}"></a></th:block>
      <nav th:replace="~{fragments/public/pagination :: pager(${posts}, '/search', ${q})}"></nav>
    </th:block>
  </section>
</main>
</body>
</html>
