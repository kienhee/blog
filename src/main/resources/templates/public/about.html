<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/public-master}">
<head>
    <title th:text="#{nav.about}">About</title>
</head>
<body>
<main layout:fragment="content">
    <section class="wrap" style="padding-top:56px">
        <h1 class="page-title page-title-narrow" th:text="#{public.about.title(${site['site.domain'] ?: siteTitle})}">About</h1>
        <div class="about-grid">
            <div style="font-size:19px;line-height:1.65;color:var(--body);display:flex;flex-direction:column;gap:24px">
                <p th:text="${siteDescription}">Site description</p>
                <p th:text="#{public.about.body1}">Two kinds of posts.</p>
                <p th:text="#{public.about.body2}">Written for people who use AI at work.</p>
            </div>
            <div style="border-top:1px solid var(--line)">
                <div class="fact-row"><span class="kicker" th:text="#{footer.site}">Site</span><span th:text="${siteTitle}">Kienhee</span></div>
                <div th:if="${site['site.domain'] != null and !site['site.domain'].isBlank()}" class="fact-row"><span class="kicker" th:text="#{public.about.domain}">Domain</span><span th:text="${site['site.domain']}">kienhee.com</span></div>
                <div class="fact-row"><span class="kicker" th:text="#{lang.label}">Language</span><span th:text="#{public.about.languages}">Tiếng Việt, English</span></div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
