<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="#{mail.reset.subject(${siteName})}">Reset your password</title>
</head>
<body style="margin:0;padding:0;background:#f3f3f1;font-family:Arial,Helvetica,sans-serif;color:#17171a">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f3f1;padding:32px 12px">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e2e0dc">
        <tr>
          <td style="padding:22px 28px;border-bottom:3px solid #17171a;font-size:20px;font-weight:bold;letter-spacing:-0.02em" th:text="${siteName}">Kienhee</td>
        </tr>
        <tr>
          <td style="padding:28px">
            <p style="margin:0 0 16px;font-size:22px;font-weight:bold;line-height:1.2" th:text="#{mail.reset.title}">Reset your password</p>
            <p style="margin:0 0 16px;font-size:15px;line-height:1.6" th:text="#{mail.greeting(${name})}">Hi there,</p>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.6" th:text="#{mail.reset.body(${minutes})}">
              Use the button below to choose a new password.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px">
              <tr>
                <td style="background:#d4401c">
                  <a th:href="${resetUrl}" href="#" style="display:inline-block;padding:14px 22px;color:#ffffff;font-size:15px;font-weight:bold;text-decoration:none" th:text="#{mail.reset.cta}">Choose a new password</a>
                </td>
              </tr>
            </table>
            <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#65625d" th:text="#{mail.link_fallback}">If the button doesn't work, paste this link into your browser:</p>
            <p style="margin:0 0 24px;font-size:13px;line-height:1.5;word-break:break-all"><a th:href="${resetUrl}" th:text="${resetUrl}" href="#" style="color:#d4401c">link</a></p>
            <p style="margin:0;font-size:13px;line-height:1.5;color:#65625d" th:text="#{mail.reset.note}">Didn't ask for this? Ignore this email.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
