<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="|Confirm your ${siteName} subscription|">Confirm your subscription</title>
</head>
<body style="margin:0;padding:0;background:#f3f3f1;font-family:Arial,Helvetica,sans-serif;color:#17171a">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f3f1;padding:32px 12px">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e2e0dc">
        <tr><td style="padding:22px 28px;border-bottom:3px solid #17171a;font-size:20px;font-weight:bold" th:text="${siteName}">Kienhee</td></tr>
        <tr>
          <td style="padding:28px">
            <p style="margin:0 0 16px;font-size:22px;font-weight:bold;line-height:1.2">Confirm your subscription</p>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.6">
              Someone signed this address up for the <span th:text="${siteName}">Kienhee</span> newsletter.
              Confirm within <strong th:text="|${days} days|">7 days</strong> to start receiving it.
            </p>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px">
              <tr><td style="background:#d4401c"><a th:href="${confirmUrl}" href="#" style="display:inline-block;padding:14px 22px;color:#ffffff;font-size:15px;font-weight:bold;text-decoration:none">Confirm subscription</a></td></tr>
            </table>
            <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#65625d">If the button doesn't work, paste this link into your browser:</p>
            <p style="margin:0 0 24px;font-size:13px;line-height:1.5;word-break:break-all"><a th:href="${confirmUrl}" th:text="${confirmUrl}" href="#" style="color:#d4401c">link</a></p>
            <p style="margin:0;font-size:13px;line-height:1.5;color:#65625d">Didn't sign up? Ignore this email and nothing happens.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
