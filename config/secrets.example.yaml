# Copy to config/secrets.yaml (git-ignored) and fill in. Environment variables work too:
# MAIL_USERNAME, MAIL_PASSWORD, MAIL_ENABLED, MAIL_FROM, APP_BASE_URL.
spring:
  mail:
    username: you@gmail.com
    # Gmail: create an app password (Google Account > Security > App passwords); 2-Step Verification must be on.
    password: your-16-char-app-password

app:
  mail:
    enabled: true
    from: you@gmail.com
